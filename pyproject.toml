# PortfolioLab is a Streamlit app, not an installable package, so this file
# deliberately holds tool configuration ONLY: there is no [project] table.
#
# Dependencies have a single source of truth: requirements.txt (exact pins,
# verified by tests/test_parity.py and tests/test_regression_frozen.py) plus
# requirements-dev.txt. CI and local dev install from those files, and so
# does Streamlit Community Cloud: it uses the first dependency file it finds
# (requirements.txt ranks above pyproject.toml) and its docs advise keeping
# only one. A second dependency list here would have to be kept in sync by
# hand on every update ritual, and it already went stale once (2026-09).

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
